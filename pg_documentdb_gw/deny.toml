[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[bans]
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow-workspace = true
# List of crates to deny
deny = [
    # Allow the driver for shared fixtures and the adapter's trace-context tests.
    { crate = "mongodb", wrappers = ["documentdb_gateway_otel", "documentdb_tests"] },
]
