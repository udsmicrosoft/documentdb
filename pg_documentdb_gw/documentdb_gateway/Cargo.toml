[package]
name = "documentdb_gateway"
description = "A gateway component for DocumentDB."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[package.metadata.deb]
name = "documentdb_gateway"
maintainer = "documentdb-packaging-maintainers@microsoft.com"
depends = []
assets = [
 ["target/release-with-symbols/documentdb_gateway", "usr/bin/", "755"],
]

[features]
default = ["request-tracing", "postgres-udf-trace-context"]
mimalloc = ["dep:mimalloc"]
request-tracing = ["documentdb_gateway_core/request-tracing"]
postgres-udf-trace-context = [
 "request-tracing",
 "documentdb_gateway_otel/postgres-udf-trace-context",
]

[dependencies]
documentdb_gateway_core.workspace = true
documentdb_gateway_otel.workspace = true
mimalloc = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
